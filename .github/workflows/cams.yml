# Air quality (Europe and the world) and European pollen from Copernicus CAMS, drawn into map tiles on Cloudflare R2
# (bucket njw-maps, public at https://maps.notjustweather.com/maps/cams/<region>/latest.json). render_cams.py does the work.
# Started by the Cloudflare cron (cron-worker/) after the CAMS release times, or by hand. Each region first asks whether a
# newer run is published and ready; "not yet" is green, a run still missing 16 h after its hour is red.
# Security: secrets are ADS_KEY (Copernicus, read only) and the njw-maps-only storage key. Fork runs never get secrets,
# and this workflow runs only on workflow_dispatch.
name: cams
on:
  workflow_dispatch:
    inputs:
      run:
        description: "Run YYYYMMDDHH for both regions (empty = the latest ready one)"
        required: false
      steps:
        description: "Lead hours, comma separated (empty = all; for a test)"
        required: false
permissions:
  contents: read
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        region: [europe, world]
    concurrency:
      group: cams-${{ matrix.region }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cams.txt
      - name: Copernicus key
        env:
          ADS_KEY: ${{ secrets.ADS_KEY }}
        run: |
          printf 'url: https://ads.atmosphere.copernicus.eu/api\nkey: %s\n' "$ADS_KEY" > ~/.cdsapirc
          chmod 600 ~/.cdsapirc
      - run: pip install "cdsapi==0.7.7"
      - name: Is there a new run?
        id: check
        env:
          RUN_ARG: ${{ github.event.inputs.run }}
        run: |
          if [[ "$RUN_ARG" =~ ^[0-9]{10}$ ]]; then echo "draw=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e; python3 render_cams.py --region ${{ matrix.region }} --check; rc=$?; set -e
          if [ "$rc" -eq 0 ]; then echo "draw=1" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 3 ]; then echo "nothing to draw yet"
          else exit "$rc"; fi
      - if: steps.check.outputs.draw == '1'
        run: pip install -r requirements-cams.txt
      - if: steps.check.outputs.draw == '1'
        name: Render and upload
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUN_ARG: ${{ github.event.inputs.run }}
          STEPS_ARG: ${{ github.event.inputs.steps }}
        run: |
          args=(--region ${{ matrix.region }} --upload)
          if [[ "$RUN_ARG" =~ ^[0-9]{10}$ ]]; then args+=(--run "$RUN_ARG"); fi
          if [[ "$STEPS_ARG" =~ ^[0-9,]+$ ]]; then args+=(--steps "$STEPS_ARG"); fi
          python render_cams.py "${args[@]}"
