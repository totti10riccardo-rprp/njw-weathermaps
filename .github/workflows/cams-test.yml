# A one-off Copernicus CAMS download test (cams_test.py). Started by hand only. The key comes from the ADS_KEY secret and is
# written to the job's own ~/.cdsapirc; it is never printed.
name: cams-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cdsapi>=0.7.7"
      - name: Download
        env:
          ADS_KEY: ${{ secrets.ADS_KEY }}
        run: |
          printf 'url: https://ads.atmosphere.copernicus.eu/api\nkey: %s\n' "$ADS_KEY" > ~/.cdsapirc
          chmod 600 ~/.cdsapirc
          python cams_test.py || true
      - name: Copernicus's own answer (raw request; prints the reply, never the key)
        env:
          ADS_KEY: ${{ secrets.ADS_KEY }}
        run: |
          curl -s -o reply.json -w "HTTP %{http_code}\n" -X POST \
            -H "PRIVATE-TOKEN: $ADS_KEY" -H "Content-Type: application/json" \
            -d '{"inputs":{"variable":["particulate_matter_2.5um"],"date":["2026-10-16/2026-10-16"],"time":["00:00"],"leadtime_hour":["0"],"type":["forecast"],"data_format":"grib","area":[50,10,45,17]}}' \
            https://ads.atmosphere.copernicus.eu/api/retrieve/v1/processes/cams-global-atmospheric-composition-forecasts/execution
          head -c 1500 reply.json; echo
