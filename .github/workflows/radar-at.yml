# Austria's precipitation "radar" layer (GeoSphere Austria's INCA nowcast, CC BY 4.0) drawn into map tiles on Cloudflare R2
# (bucket njw-maps, public at https://maps.notjustweather.com/maps/radar-at/frames.json). render_radar_at.py does the work.
# Every 15 minutes, just after GeoSphere publishes (its runs are at :00/:15/:30/:45, the frame is valid 15 min later). GitHub's
# schedule can drift or skip under load; the Cloudflare cron worker (cron-worker/) can take over dispatching later.
# Security: secrets are R2_ENDPOINT and the njw-maps-only storage key. Fork runs never get secrets.
name: radar-at
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-at
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-radar.txt
      - run: pip install -r requirements-radar.txt
      - name: Draw the newest frame
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python render_radar_at.py --upload
