# Deploy: (cd cron-worker && wrangler deploy). Secret: wrangler secret put GH_TOKEN --name njw-weathermaps-cron.
# Free plan. A GFS run's last file lands ~3 h 40 min after its hour: fire at :50 after, and again 30 minutes later.
name = "njw-weathermaps-cron"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
# CAMS (cams.yml): its 00 UTC runs are usually in by ~10 UTC; 13:30 retries; 22:30 takes the global 12 UTC run.
# Radar (radar-at.yml + radar-nordic.yml): every 15 minutes, just after GeoSphere/SMHI/DMI publish. 4 crons in all (free plan: 5).
crons = ["50 3,9,15,21 * * *", "20 4,10,16,22 * * *", "30 10,13,22 * * *", "4,19,34,49 * * * *"]
